<!--
  MARCO COMÚN de todos los correos de Galería 9 (encabezado, portada, título, iconos, botón y pie).
  Cada correo (bienvenida-newsletter.html, bienvenida-pp.html, tester-day.html, agenda.html)
  se inserta en [[&contenido]]. Ver LEEME.md.
-->
<div style="display:none;max-height:0;overflow:hidden">[[preview]]</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f2f2">
<tr><td align="center" style="padding:28px 14px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#2b2b2a">

  <!-- encabezado: logo + GALERÍA 9 a la izquierda, tipo de correo a la derecha -->
  <tr><td style="padding:16px 28px 14px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
      <td valign="middle" style="width:30px"><img src="[[site]]/logo.png" height="38" alt="Galería 9" style="display:block;height:38px;width:auto;border:0"></td>
      <td valign="middle" style="padding-left:12px;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#2b2b2a;white-space:nowrap">Galería 9</td>
      [[#eyebrow]]<td valign="middle" align="right" style="font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#8a7a52">[[eyebrow]]</td>[[/eyebrow]]
    </tr></table>
  </td></tr>

  [[#portada]]<tr><td style="padding:0"><img src="[[site]]/email/[[portada]]" width="560" alt="" style="display:block;width:100%;max-width:560px;height:auto;border:0"></td></tr>[[/portada]]

  <tr><td style="padding:24px 28px 0">
    <div style="font-size:28px;font-weight:200;line-height:1.15;margin:0 0 16px">[[titulo]]</div>
  </td></tr>

  <tr><td style="padding:0 28px;font-size:15px;line-height:1.6;font-weight:300">[[&contenido]]</td></tr>

  [[#hay_iconos]]<tr><td style="padding:14px 20px 8px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f5f1;border-top:1px solid #e4dfd8;border-bottom:1px solid #e4dfd8"><tr><td style="padding:18px 0">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
        [[#iconos]]<td valign="top" width="33%" style="padding:0 8px;text-align:center">
          <img src="[[site]]/email/ic-[[icono]].png" width="40" height="40" alt="" style="display:block;margin:0 auto 8px;border:0">
          <div style="font-size:13px;font-weight:500;color:#2b2b2a;margin:0 0 3px">[[titulo]]</div>
          <div style="font-size:12px;line-height:1.45;color:#6b6b69">[[texto]]</div>
        </td>[[/iconos]]
      </tr></table>
    </td></tr></table>
  </td></tr>[[/hay_iconos]]

  [[#boton]]<tr><td style="padding:10px 28px 26px"><a href="[[&url]]" style="display:inline-block;background:#2b2b2a;color:#f2f2f2;text-decoration:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:14px 24px">[[texto]] →</a></td></tr>[[/boton]]

  <!-- pie -->
  <tr><td style="padding:18px 28px 24px;border-top:1px solid #e4dfd8;font-size:12px;color:#8a8a88;line-height:1.6">
    Galería 9 · Providencia, Guadalajara<br>
    <a href="https://instagram.com/galeria9providencia" style="color:#8a7a52">Instagram</a> · <a href="https://wa.me/523318030563" style="color:#8a7a52">WhatsApp</a> · <a href="[[site]]" style="color:#8a7a52">galeria9</a>
  </td></tr>
</table></td></tr></table>
