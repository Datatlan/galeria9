<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datatlan · Propuesta</title>
<!--
  ┌─────────────────────────────────────────────────────────────────────┐
  │  PLANTILLA DE PROPUESTAS · DATATLAN                                   │
  │                                                                       │
  │  Cómo usar:                                                           │
  │   1. Copia este archivo con el nombre del cliente                     │
  │      (ej. propuesta-estudio-luna.html).                               │
  │   2. Edita SOLO el bloque DATA de abajo (const DATA = {...}).         │
  │      Todo el documento se arma solo a partir de ahí.                  │
  │   3. Abre en el navegador → Imprimir → "Guardar como PDF"             │
  │      (tamaño Carta o A4, márgenes: Ninguno / Predeterminado).         │
  │                                                                       │
  │  El diseño vive en el <style>. Los textos viven en DATA.             │
  └─────────────────────────────────────────────────────────────────────┘
-->
</head>
<body>
<style>
  :root{
    color-scheme:light;
    --ink:#0d1b2a;          /* deep navy */
    --ink-soft:#33475b;
    --slate:#64748b;
    --line:#dbe4f0;
    --niebla:#eef3fa;
    --papel:#ffffff;
    --papel-2:#f7fafd;
    --azul:#2563eb;
    --azul-ink:#1d4ed8;
    --cian:#06b6d4;
    --teal:#00a89e;
    --teal-ink:#068b83;
    --azul-wash:#eaf1ff;
    --teal-wash:#e2f7f4;
    --amber-wash:#fff7e8;
    --amber-ink:#b45309;
    --shadow:0 1px 2px rgba(13,27,42,.05), 0 12px 32px -12px rgba(13,27,42,.18);
    --shadow-lift:0 2px 6px rgba(13,27,42,.08), 0 30px 60px -24px rgba(37,99,235,.30);
    --r:16px; --r-sm:11px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font); color:var(--ink); background:var(--niebla);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }

  /* ── screen scaffolding: pages float as sheets on the fog ─────────── */
  .screen-bg{
    min-height:100vh; padding:clamp(16px,4vw,44px) 0 60px;
    background:
      radial-gradient(1100px 620px at 84% -6%, color-mix(in srgb, var(--cian) 15%, transparent), transparent 60%),
      radial-gradient(1000px 640px at 6% 106%, color-mix(in srgb, var(--azul) 14%, transparent), transparent 62%),
      var(--niebla);
  }
  .toolbar{
    max-width:816px; margin:0 auto 22px; padding:0 16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .toolbar .hint{font-size:12.5px; color:var(--slate)}
  .toolbar .hint b{color:var(--ink-soft)}
  .btn-print{
    font:inherit; font-weight:700; font-size:14px; cursor:pointer; border:0; border-radius:11px;
    padding:11px 18px; color:#fff; background:linear-gradient(135deg,var(--azul),var(--cian));
    box-shadow:0 10px 22px -10px color-mix(in srgb,var(--azul) 75%, transparent);
    display:inline-flex; align-items:center; gap:8px; transition:.18s var(--ease);
  }
  .btn-print:hover{transform:translateY(-2px); box-shadow:0 16px 30px -12px color-mix(in srgb,var(--azul) 80%, transparent)}
  .btn-print svg{width:16px; height:16px}

  /* ── the page (A4-ish sheet) ──────────────────────────────────────── */
  .doc{max-width:816px; margin:0 auto; padding:0 16px}
  .page{
    position:relative; background:var(--papel); color:var(--ink);
    width:210mm; min-height:0;                  /* documento en flujo continuo sobre ancho A4 */
    border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-lift);
    padding:14mm 16mm; margin:0 auto 16px; overflow:visible;
  }
  .page-pad-lg{padding:20mm 18mm}

  /* faint isometric grid, echoing the logo/hero */
  .grid-motif::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.55;
    background-image:
      repeating-linear-gradient(30deg, color-mix(in srgb,var(--azul) 6%, transparent) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(-30deg, color-mix(in srgb,var(--cian) 6%, transparent) 0 1px, transparent 1px 46px);
    -webkit-mask-image:radial-gradient(120% 90% at 50% 0%, #000, transparent 72%);
            mask-image:radial-gradient(120% 90% at 50% 0%, #000, transparent 72%);
  }
  .page > *{position:relative; z-index:1}

  /* ── shared type ──────────────────────────────────────────────────── */
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--azul); font-weight:600; margin:0}
  .eyebrow.teal{color:var(--teal-ink)}
  h1.title{font-size:34px; line-height:1.08; letter-spacing:-.025em; font-weight:800; margin:10px 0 0; text-wrap:balance}
  h2.sec{font-size:23px; line-height:1.15; letter-spacing:-.02em; font-weight:800; margin:8px 0 0}
  .lead{color:var(--ink-soft); font-size:15.5px; line-height:1.6; margin:14px 0 0; max-width:62ch}
  p{margin:12px 0 0}

  .gtitle{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--slate); margin:0 0 14px; display:flex; align-items:center; gap:10px}
  .gtitle::after{content:""; flex:1; height:1px; background:var(--line)}

  /* brand lockup */
  .brand{display:inline-flex; align-items:center; gap:11px; font-weight:750; letter-spacing:-.02em; font-size:19px; color:var(--ink)}
  .brand .logo{width:32px; height:32px; flex:none}
  .brand small{display:block; font-weight:500; font-size:11px; letter-spacing:.02em; color:var(--slate); margin-top:1px}

  /* ── PORTADA ──────────────────────────────────────────────────────── */
  .cover{display:flex; flex-direction:column; min-height:255mm}
  .cover-top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px}
  .cover-badge{font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--azul-ink); background:var(--azul-wash); border:1px solid color-mix(in srgb,var(--azul) 22%, transparent); padding:7px 13px; border-radius:999px; font-weight:600}
  .cover-mid{margin-top:auto; padding:40px 0}
  .cover-eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--cian); font-weight:600; margin:0}
  .cover h1{font-size:52px; line-height:1.04; letter-spacing:-.03em; font-weight:850; margin:14px 0 0; text-wrap:balance}
  .cover .tagline{font-size:18px; color:var(--ink-soft); margin:18px 0 0; max-width:44ch; line-height:1.5}
  .cover-hero{position:absolute; right:-40px; top:120px; width:360px; height:360px; opacity:.9; z-index:0}
  .cover-meta{margin-top:32px; border-top:1px solid var(--line); padding-top:26px; display:grid; grid-template-columns:repeat(2,1fr); gap:20px 40px}
  .meta-item{display:flex; flex-direction:column; gap:4px}
  .meta-item .k{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--slate)}
  .meta-item .v{font-size:15.5px; font-weight:650; color:var(--ink)}
  .cover-strip{margin-top:26px; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--slate)}
  .cover-strip .dot{width:7px;height:7px;border-radius:999px;background:var(--teal)}

  /* ── análisis ─────────────────────────────────────────────────────── */
  .obj-list{list-style:none; margin:20px 0 0; padding:0; display:grid; gap:12px}
  .obj-list li{position:relative; padding:2px 0 2px 32px; font-size:15px; color:var(--ink-soft); line-height:1.55}
  .obj-list li::before{
    content:""; position:absolute; left:0; top:3px; width:19px; height:19px; border-radius:6px;
    background:linear-gradient(140deg,var(--azul-wash),color-mix(in srgb,var(--cian) 22%, var(--azul-wash)));
    border:1px solid color-mix(in srgb,var(--azul) 24%, transparent);
  }
  .obj-list li::after{content:""; position:absolute; left:6px; top:8px; width:7px; height:4px; border-left:2px solid var(--azul-ink); border-bottom:2px solid var(--azul-ink); transform:rotate(-45deg)}

  .callout{
    margin-top:26px; display:flex; gap:13px; align-items:flex-start; padding:18px 20px;
    background:var(--teal-wash); border:1px solid color-mix(in srgb,var(--teal) 30%, transparent);
    border-radius:14px; font-size:14px; line-height:1.55; color:var(--ink-soft);
  }
  .callout svg{width:20px; height:20px; flex:none; color:var(--teal-ink); margin-top:2px}
  .callout b{color:var(--ink)}

  /* ── desglose de servicios ────────────────────────────────────────── */
  .svc-group + .svc-group{margin-top:30px}
  .svc{
    display:flex; align-items:flex-start; gap:15px; padding:16px 18px; border:1.4px solid var(--line);
    border-radius:13px; background:var(--papel-2); margin-bottom:11px;
  }
  .svc .ico{
    width:42px; height:42px; flex:none; border-radius:11px; display:grid; place-items:center;
    background:linear-gradient(140deg,var(--azul-wash),color-mix(in srgb,var(--cian) 22%, var(--azul-wash)));
    color:var(--azul-ink);
  }
  .svc.mejorar .ico{background:linear-gradient(140deg,var(--teal-wash),color-mix(in srgb,var(--teal) 26%, var(--teal-wash))); color:var(--teal-ink)}
  .svc .ico svg{width:22px; height:22px}
  .svc .body{flex:1; min-width:0}
  .svc .name{font-weight:700; font-size:15.5px; letter-spacing:-.01em}
  .svc .desc{font-size:13.5px; color:var(--slate); margin-top:3px; line-height:1.5}
  .svc .stack{font-family:var(--mono); font-size:11px; color:var(--slate); margin-top:6px}
  .svc-items{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:5px}
  .svc-items li{position:relative; padding-left:17px; font-size:13px; color:var(--ink-soft); line-height:1.45}
  .svc-items li::before{content:""; position:absolute; left:2px; top:7px; width:5px; height:5px; border-radius:1.5px; background:var(--azul)}
  .svc.mejorar .svc-items li::before{background:var(--teal)}
  .mode{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; padding:5px 11px; border-radius:999px; flex:none; align-self:center}
  .mode.crear{color:var(--azul-ink); background:var(--azul-wash)}
  .mode.mejorar{color:var(--teal-ink); background:var(--teal-wash)}
  .mode.incluido{color:var(--slate); background:var(--niebla)}

  /* ── proceso / timeline ───────────────────────────────────────────── */
  .steps{list-style:none; margin:22px 0 0; padding:0; counter-reset:s}
  .steps li{position:relative; padding:0 0 26px 52px; counter-increment:s}
  .steps li:last-child{padding-bottom:0}
  .steps li::before{
    content:counter(s); position:absolute; left:0; top:-2px; width:34px; height:34px; border-radius:10px;
    display:grid; place-items:center; font-family:var(--mono); font-weight:700; font-size:14px; color:#fff;
    background:linear-gradient(135deg,var(--azul),var(--cian)); box-shadow:0 8px 16px -8px color-mix(in srgb,var(--azul) 70%, transparent);
  }
  .steps li::after{content:""; position:absolute; left:16px; top:34px; bottom:6px; width:2px; background:linear-gradient(var(--line),transparent)}
  .steps li:last-child::after{display:none}
  .steps .st-name{font-weight:700; font-size:15.5px}
  .steps .st-desc{font-size:13.5px; color:var(--slate); margin-top:3px; line-height:1.5}
  .steps .st-when{font-family:var(--mono); font-size:11px; color:var(--teal-ink); margin-top:4px; font-weight:600}

  /* ── equipo ───────────────────────────────────────────────────────── */
  .team{display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-top:22px}
  .member{border:1.4px solid var(--line); border-radius:14px; background:var(--papel-2); padding:20px}
  .member .avatar{
    width:52px; height:52px; border-radius:13px; display:grid; place-items:center; font-weight:800; font-size:20px; color:#fff;
    background:linear-gradient(140deg,var(--azul),var(--cian)); letter-spacing:-.02em; margin-bottom:14px;
  }
  .member .m-name{font-weight:750; font-size:16px; letter-spacing:-.01em}
  .member .m-role{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--azul-ink); margin-top:3px}
  .member .m-bio{font-size:13px; color:var(--ink-soft); margin-top:10px; line-height:1.55}

  /* ── cotización ───────────────────────────────────────────────────── */
  .quote-table{width:100%; border-collapse:collapse; margin-top:22px}
  .quote-table th{
    text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--slate); font-weight:600; padding:0 0 12px; border-bottom:1.5px solid var(--line);
  }
  .quote-table th.num{text-align:right}
  .quote-table td{padding:15px 0; border-bottom:1px solid var(--line); vertical-align:top}
  .quote-table .c-name{font-weight:650; font-size:15px}
  .quote-table .c-note{font-size:12.5px; color:var(--slate); margin-top:3px; line-height:1.45}
  .quote-table .c-amt{text-align:right; font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:16px}
  .quote-table .c-amt.tbd{font-weight:600; color:var(--slate); font-style:italic}
  .quote-total{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-top:22px; padding:20px 22px; border-radius:14px; background:linear-gradient(160deg, color-mix(in srgb,var(--azul) 9%, var(--papel)), var(--papel)); border:1px solid color-mix(in srgb,var(--azul) 22%, transparent)}
  .quote-total .t-label{font-weight:700; font-size:15px}
  .quote-total .t-label small{display:block; font-weight:500; font-size:12px; color:var(--slate); font-family:var(--mono); letter-spacing:.04em; margin-top:2px}
  .quote-total .t-amt{font-size:30px; font-weight:850; letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--ink)}

  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:28px}
  .infobox{border:1.4px solid var(--line); border-radius:13px; padding:18px 20px; background:var(--papel-2)}
  .infobox h4{margin:0 0 12px; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--slate); font-weight:600}
  .infobox ul{margin:0; padding:0; list-style:none; display:grid; gap:9px}
  .infobox li{position:relative; padding-left:20px; font-size:13.5px; color:var(--ink-soft); line-height:1.5}
  .infobox li::before{content:""; position:absolute; left:2px; top:7px; width:7px; height:7px; border-radius:2px; background:var(--azul)}
  .infobox .kv{display:flex; justify-content:space-between; gap:12px; font-size:13.5px; padding:5px 0; border-bottom:1px dashed var(--line)}
  .infobox .kv:last-child{border-bottom:0}
  .infobox .kv .k{color:var(--slate)} .infobox .kv .v{font-weight:650; color:var(--ink); text-align:right}

  .own-note{
    margin-top:26px; display:flex; gap:13px; align-items:flex-start; padding:18px 20px;
    background:var(--amber-wash); border:1px solid color-mix(in srgb,var(--amber-ink) 26%, transparent);
    border-radius:14px; font-size:13.5px; line-height:1.55; color:var(--ink-soft);
  }
  .own-note svg{width:20px; height:20px; flex:none; color:var(--amber-ink); margin-top:2px}
  .own-note b{color:var(--ink)}

  /* ── footer on each page ──────────────────────────────────────────── */
  .page-foot{
    position:static; margin-top:20px; z-index:1;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-size:11px; color:var(--slate); border-top:1px solid var(--line); padding-top:10px;
  }
  .page-foot .l{display:inline-flex; align-items:center; gap:8px; font-weight:600; color:var(--ink-soft)}
  .page-foot .l svg{width:15px; height:15px}

  /* closing CTA band */
  .cta-band{
    margin-top:30px; border-radius:16px; padding:30px 32px; color:#fff;
    background:linear-gradient(135deg, var(--azul-ink), var(--cian));
    box-shadow:0 24px 48px -20px color-mix(in srgb,var(--azul) 70%, transparent);
  }
  .cta-band h3{margin:0; font-size:22px; letter-spacing:-.02em; font-weight:800}
  .cta-band p{margin:10px 0 0; font-size:14.5px; opacity:.92; line-height:1.55; max-width:52ch}
  .cta-band .contacts{margin-top:20px; display:flex; flex-wrap:wrap; gap:10px}
  .cta-band .contacts a{color:#fff; text-decoration:none; font-weight:650; font-size:13.5px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28); padding:9px 15px; border-radius:999px; display:inline-flex; align-items:center; gap:8px}
  .cta-band .contacts a svg{width:15px; height:15px}

  /* ── print ────────────────────────────────────────────────────────── */
  @page{ size:A4; margin:0 }
  @media print{
    /* fuerza a imprimir TODOS los colores/fondos (gradientes, washes, badges, retícula) sin depender del check "Gráficos de fondo" */
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important }
    .screen-bg{background:#fff; padding:0}
    .toolbar{display:none}
    .doc{max-width:none; padding:0}
    .page{
      box-shadow:none; border:0; border-radius:0; margin:0;
      width:210mm; min-height:0; overflow:visible;      /* flujo continuo: llena cada A4 sin dejar hojas sueltas */
      break-after:auto; padding:12mm 16mm;
    }
    #doc > .page:first-child{ break-after:page }         /* la portada ocupa su propia hoja */
    .grid-motif::before{opacity:.4}
    /* que nada se parta a la mitad entre páginas */
    h2.sec, .gtitle, .eyebrow, .cover-eyebrow{break-after:avoid}
    .svc, .member, .infobox, .quote-total, .callout, .cta-band, .maprow, .tier, .obj-list li, .steps li, .svc-items, .two-col, .page-foot{break-inside:avoid}
  }
  @media (max-width:680px){
    .page{width:100%; padding:34px 24px; min-height:auto}
    .cover h1{font-size:38px}
    .cover-meta,.two-col,.team{grid-template-columns:1fr; gap:16px}
    .cover-hero{display:none}
    .page-foot{position:static; left:auto; right:auto; bottom:auto; margin-top:32px}
  }
</style>

<div class="screen-bg">
  <div class="doc" id="doc"><!-- render target --></div>
</div>

<script>
const DATA = {
  // ── portada ──
  paquete:   "Reservas, Cobros y Operación",
  variante:  "Arranque a la medida",          // eligió 4 módulos, sin núcleo web/marca
  tagline:   "Que reservar, cobrar y llevar el control de tus tres frentes deje de vivir en WhatsApp — en un sistema que es 100% tuyo.",
  cliente:   "Galería 9",
  giro:      "Cabinas de bienestar, talleres y Market para marcas · Guadalajara",
  proyecto:  "Setup de digitalización — Reservas, cobros, base operativa",
  preparadoPor: "Luis Franco",
  fechaEmision: "25 de julio de 2026",
  vigencia:     "24 de agosto de 2026",
  duracion:     "1 mes",

  // ── análisis del proyecto ──
  contexto: "Galería 9 vive de tres frentes: las cabinas para sus servicios de bienestar (sound healing, nutrición, terapias, psicología), los espacios para talleres y experiencias grupales, y el Market, donde marcas emprendedoras mueven sus productos. Hoy todo se reserva por WhatsApp: el cliente escribe, le muestran las opciones a mano y hasta el final le mandan los datos de pago. Funciona por el encanto del lugar, pero cada reserva se arma una por una y no queda registro que deje ver qué frente llena más. Esta propuesta convierte ese flujo —para los tres frentes— en un sistema de reservas, cobros y operación, montado sobre cuentas 100% tuyas.",
  objetivos: [
    "Que reserven cabinas, talleres y lugares del Market en línea, con un link que compartes por Instagram o WhatsApp.",
    "Cobrar en línea —depósitos, sesiones y lugares del Market— sin mandar los datos de pago a mano.",
    "Centralizar en una sola base tus tres frentes, tus aliados (marcas y especialistas) y tus clientes.",
    "Medir qué frente —cabinas, talleres o Market— llena y conviene impulsar, con datos en vez de intuición."
  ],

  // ── desglose de servicios ──
  // group: "nucleo" | "modulo"  ·  mode: "incluido" | "crear" | "mejorar"
  servicios: [
    { id:"handover", group:"nucleo", mode:"incluido", name:"Cuenta madre + puesta en marcha", items:["Cuenta de negocio principal","Listado de apps y servicios contratados","Sesión de capacitación","Siguientes pasos recomendados"] },

    { id:"sitio",    group:"modulo", mode:"crear", name:"Landing page (link-tree)", desc:"Una página-hub simple estilo link-tree para tu bio de Instagram: enruta reservas, catálogo y contacto.", stack:"Webflow / Carrd" },
    { id:"form",     group:"modulo", mode:"crear", name:"Form de contacto general", desc:"Formulario de contacto y solicitudes; cada envío cae como lead en tu base.", stack:"Airtable / Tally" },
    { id:"espacios", group:"modulo", mode:"crear", name:"Catálogo y reserva de espacios", desc:"Tus espacios presentados y reservables en línea (renta y lugares del Market).", stack:"Webflow + Cal.com" },
    { id:"reservas", group:"modulo", mode:"crear", name:"Reserva de citas / visitas / meets", desc:"Agenda de visitas y reuniones 1:1 en línea, sincronizada con tu calendario.", stack:"Cal.com" },

/* hero isométrico grande para la portada (pila de tiers) */
function heroStack(){
  const cx=180, baseY=250, tierH=26, gap=5, topW=230, n=5;
  const tops=['#12b0d6','#1f93cf','#1c7dc6','#1663bd','#1450ad'];
  let g='';
  for(let i=0;i<n;i++){
    const scale=1-(i*0.12), w=topW*scale, h=w*0.42, y=baseY-i*(tierH+gap), x=cx;
    g+=`<polygon points="${x},${y-h/2} ${x+w/2},${y} ${x},${y+h/2} ${x-w/2},${y}" fill="${tops[i]}" opacity="0.95"/>`
     + `<polygon points="${x-w/2},${y} ${x},${y+h/2} ${x},${y+h/2+tierH} ${x-w/2},${y+tierH}" fill="#0f3f88"/>`
     + `<polygon points="${x+w/2},${y} ${x},${y+h/2} ${x},${y+h/2+tierH} ${x+w/2},${y+tierH}" fill="#0a9bc0"/>`;
  }
  return `<svg class="cover-hero" viewBox="0 0 360 360" fill="none" aria-hidden="true">${g}</svg>`;
}
